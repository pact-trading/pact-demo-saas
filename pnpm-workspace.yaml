# @pactagent/* releases are new; let pnpm install them before the minimum release age passes.
minimumReleaseAgeExclude:
  - '@pactagent/*'
allowBuilds:
  sharp: true
  '@tailwindcss/oxide': true
# Temporary, until @pactagent/checkout-react 0.2.0 (embedded <Subscribe>) is on npm: the local package
# declares its core dependency as workspace:*, so point it at the published core.
overrides:
  '@pactagent/core': ^0.1.0
